<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SQLIFY | Make sql ready 'in' strings</title>
  <link rel="shortcut icon" href="favicon.ico"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- CSS -->
  <link rel="stylesheet" href="css/font-awesome.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="container">
    <div class="row pt-5">
      <div class="col-md-auto"> 
          <h2>Hello Sqlify</h2>
          <div class="text-muted">Replace all linebreaks and make ('an','sql','ready','IN','string')</div>
      </div> 
    </div>
    <div class="row py-2">
      <div class="col">
        <form>
          <div class="form-group">
            <textarea class="form-control" id="input" rows="10" placeholder="Put your strings here, one on each row."></textarea>
          </div>
          <div class="form-group">
            <textarea class="form-control" id="output" rows="5" readonly placeholder="('Output','will','be','something','like','this')"></textarea>
          </div>
        </form>
        <div class="btn-toolbar justify-content-between" role="toolbar">
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary" onclick="sqlifyTheInputText()">
              <i class="fa fa-database" aria-hidden="true"></i> SQLIFY
            </button>
            <button type="button" class="btn btn-secondary" onclick="copyOutputToClipboard()">
              <i class="fa fa-clipboard" aria-hidden="true"></i> COPY TO CLIPBOARD
            </button>
            <button type="button" class="btn btn-danger" onclick="clearTextareas()">
              <i class="fa fa-eraser" aria-hidden="true"></i> CLEAR ALL
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="row">
        <small class="text-muted" id="valueCountLabel">0</small> <small class="text-muted pl-1">values in sqlify string!</small>
      </div>
    </div>
  </div>
  <footer class="mt-4 text-center">
    <i class="fa fa-github" aria-hidden="true"></i> This code is available on <a href="https://github.com/PROOHF/sqlify">GitHub</a> | Have this random dude made more useful stuff? <a href="http://www.proohf.com/">Let's see</a>
  </footer>

  <!-- JavaScript -->
  <script src="js/scripts.js"></script>
</body>
</html>
