<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>SQLIFY | Make sql ready 'in' strings</title>
  <link rel="shortcut icon" href="favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <!-- CSS -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="container">
    <div class="row pt-5">
      <div class="col-md-auto">
        <h1>Hello dear Sqlifyer!</h1>
        <div class="text-muted">Replace all linebreaks and make <br>('an','sql','ready','IN','string')</div>
      </div>
    </div>
    <div class="row py-2">
      <div class="col">
        <form>
          <div class="form-group">
            <textarea class="form-control" id="input" rows="10"
              placeholder="Put your data here, one on each row please."></textarea>
          </div>
          <div class="form-group">
            <textarea class="form-control" id="output" rows="5" readonly
              placeholder="('Output','will','be','something','like','this')"></textarea>
          </div>
        </form>
        <div class="btn-toolbar justify-content-between" role="toolbar">
          <div class="btn-group" role="group">
            <button type="button" class="btn btn-primary" onclick="sqlifyTheInputText()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                <path d="M3 5v14a9 3 0 0 0 18 0V5"></path>
                <path d="M3 12a9 3 0 0 0 18 0"></path>
              </svg>

              SQLIFY

            </button>
            <button type="button" class="btn btn-secondary" onclick="copyOutputToClipboard()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <rect width="8" height="4" x="8" y="2" rx="1" ry="1"></rect>
                <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
              </svg>

              COPY TO CLIPBOARD

            </button>
            <button type="button" class="btn btn-danger" onclick="clearTextareas()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                aria-hidden="true">
                <path d="M20 20H7L3 16c-.6-.6-.6-1.5 0-2.1l10-10c.6-.6 1.5-.6 2.1 0l7 7c.6.6.6 1.5 0 2.1L14 20"></path>
                <path d="m11 11 5 5"></path>
              </svg>

              CLEAR ALL

            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="col">
      <div class="row">
        <small class="text-muted" id="valueCountLabel">0</small> <small class="text-muted pl-1">values in sqlify
          string!</small>
      </div>
    </div>
  </div>
  <footer class="mt-4">
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" fill="currentColor"
      aria-hidden="true">
      <path
        d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12">
      </path>
    </svg>
    This code is available on <a href="https://github.com/PROOHF/sqlify">GitHub</a> | Have this random dude made more
    useful stuff? <a href="http://www.proohf.com/">Let's see</a>
  </footer>

  <!-- JavaScript -->
  <script src="js/scripts.js"></script>
</body>

</html>
